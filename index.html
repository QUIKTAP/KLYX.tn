<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Poppins', Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
  color: #0f172a;
  animation: fadeIn 1.2s ease;
  position: relative;
  overflow: hidden;
}

/* ── ONDES FLUIDES COMME LE FLYER ── */
body::before {
  content: '';
  position: fixed;
  top: -100px; left: -100px;
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(168,85,247,0.13) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  bottom: -100px; right: -100px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(45,212,191,0.13) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* SVG waves decoratives */
.wave-svg {
  position: fixed;
  pointer-events: none;
  z-index: 0;
}
.wave-svg.top-left  { top: 0; left: 0; width: 420px; opacity: 0.55; }
.wave-svg.bot-right { bottom: 0; right: 0; width: 380px; opacity: 0.45; transform: rotate(180deg); }

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to   { opacity: 1; transform: scale(1); }
}

.container {
  text-align: center;
  position: relative;
  z-index: 1;
  padding: 40px 20px;
}

/* ── PROFILE ── */
.profile {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: auto;
  box-shadow:
    0 0 0 3px rgba(168,85,247,0.4),
    0 0 0 8px rgba(45,212,191,0.12),
    0 15px 40px rgba(124,58,237,0.2);
  animation: pulseGlow 3s ease-in-out infinite;
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 3px rgba(168,85,247,0.4), 0 0 0 8px rgba(45,212,191,0.12), 0 15px 40px rgba(124,58,237,0.2); }
  50%       { box-shadow: 0 0 0 4px rgba(168,85,247,0.7), 0 0 0 14px rgba(45,212,191,0.2), 0 15px 40px rgba(124,58,237,0.3); }
}

.profile img {
  width: 95px;
}

/* ── TITLE ── */
h1 {
  margin-top: 18px;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 5px;
  color: #0f172a;
}

h1 span {
  background: linear-gradient(135deg, #7c3aed, #2dd4bf);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── SUBTITLE ── */
.subtitle {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #7c3aed;
  margin-top: 6px;
  margin-bottom: 8px;
}

/* ── WEBSITE LINK ── */
.container > a:not(.button) {
  display: inline-block;
  font-size: 12px;
  color: #2dd4bf;
  text-decoration: none;
  letter-spacing: 1px;
  border-bottom: 1px solid rgba(45,212,191,0.35);
  padding-bottom: 2px;
  transition: color 0.2s, border-color 0.2s;
  margin-bottom: 4px;
}

.container > a:not(.button):hover {
  color: #7c3aed;
  border-color: rgba(124,58,237,0.4);
}

/* ── DIVIDER ── */
.divider {
  width: 60px;
  height: 2px;
  background: linear-gradient(to right, #7c3aed, #2dd4bf);
  border-radius: 2px;
  margin: 20px auto 0;
}

/* ── ICONS ── */
.icons {
  display: flex;
  justify-content: center;
  gap: 18px;
  font-size: 26px;
  margin-top: 22px;
}

.icons a {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #7c3aed;
  background: rgba(124,58,237,0.07);
  border: 1.5px solid rgba(124,58,237,0.15);
  transition: 0.3s;
  font-size: 20px;
  text-decoration: none;
}

.icons a:hover {
  background: linear-gradient(135deg, #7c3aed, #2dd4bf);
  color: white;
  border-color: transparent;
  transform: translateY(-4px) scale(1.1);
  box-shadow: 0 10px 25px rgba(124,58,237,0.3);
}

/* ── BUTTON ── */
.button {
  margin-top: 32px;
  background: linear-gradient(135deg, #7c3aed, #2dd4bf);
  color: white;
  padding: 15px 36px;
  border-radius: 40px;
  display: inline-block;
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 1px;
  box-shadow: 0 10px 30px rgba(124,58,237,0.3);
  transition: 0.3s;
  cursor: pointer;
  text-decoration: none;
}

.button:hover {
  transform: scale(1.08);
  box-shadow: 0 16px 40px rgba(124,58,237,0.45);
  background: linear-gradient(135deg, #2dd4bf, #7c3aed);
  color: white;
}

@media(max-width: 500px) {
  h1 { font-size: 26px; }
  .icons { gap: 12px; }
  .icons a { width: 46px; height: 46px; font-size: 18px; }
}
</style>
</head>
